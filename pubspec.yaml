name: spend_summary_app
description: Spend Summary Flutter expense dashboard application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: 6.1.2
  go_router: 14.2.7

  # Required lightweight services for Spend Summary app
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3
  flutter_secure_storage: 9.2.2
  permission_handler: 11.3.1
  image_picker: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/data/
